<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoTIFF 3D Visualizer</title>
    <style>
      :root {
        --bg: #0a0f1c;
        --panel: rgba(13, 20, 36, 0.82);
        --border: rgba(120, 180, 255, 0.14);
        --text: #dbe6f5;
        --text-dim: #7d8ca3;
        --accent: #35b8a4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }

      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 240px;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        user-select: none;
      }
      .panel h1 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .row { margin-bottom: 12px; }
      .row label {
        display: block;
        margin-bottom: 5px;
        font-size: 11px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      select, button {
        width: 100%;
        padding: 7px 9px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 7px;
        font: inherit;
        cursor: pointer;
      }
      select:hover, button:hover { background: rgba(255, 255, 255, 0.1); }
      button.active {
        background: rgba(53, 184, 164, 0.28);
        border-color: var(--accent);
        color: #d9fff7;
      }

      #fill-panel { padding-top: 2px; }
      #cap-slider {
        width: 100%;
        margin-bottom: 6px;
      }
      #cap-slider { width: 100%; }
      #cap-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      #cap-slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .cap-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-dim);
        margin-bottom: 6px;
      }
      .cap-row span:last-child {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .slider-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 2px;
      }
      input[type="number"] {
        width: 68px;
        padding: 4px 6px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 7px;
        font: inherit;
        font-variant-numeric: tabular-nums;
        text-align: right;
        -moz-appearance: textfield;
        appearance: textfield;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
      }
      .hint { margin: 10px 0 0; font-size: 11px; color: var(--text-dim); }

      #info {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        padding: 6px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        font-variant-numeric: tabular-nums;
        white-space: normal;
        max-width: min(92vw, 760px);
        text-align: center;
        line-height: 1.5;
      }
      #compass {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 56px;
        height: 56px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 50%;
        backdrop-filter: blur(10px);
      }
      #compass-dial {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
      }
      #compass-dial .needle {
        position: absolute;
        left: 50%;
        width: 0;
        height: 0;
        margin-left: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
      }
      #compass-dial .north { bottom: 50%; border-bottom: 19px solid #e5484d; }
      #compass-dial .south { top: 50%; border-top: 17px solid #4a5666; }
      #compass-dial .cap {
        position: absolute;
        top: -2px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        color: #e5484d;
      }

      #dropzone {
        position: fixed;
        inset: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px dashed var(--accent);
        border-radius: 18px;
        background: rgba(53, 184, 164, 0.08);
        font-size: 20px;
        color: var(--accent);
        pointer-events: none;
      }
      #loading {
        position: fixed;
        top: 16px;
        right: 16px;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        backdrop-filter: blur(10px);
        color: var(--accent);
      }
      #error {
        position: fixed;
        top: 16px;
        right: 16px;
        max-width: 340px;
        padding: 10px 14px;
        background: rgba(80, 20, 24, 0.92);
        border: 1px solid rgba(255, 120, 120, 0.35);
        border-radius: 8px;
        color: #ffd9d9;
        white-space: pre-wrap;
      }
      #welcome {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: var(--text-dim);
        pointer-events: none;
      }
      #welcome .big { font-size: 26px; color: var(--text); margin-bottom: 8px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="panel">
      <h1>GeoTIFF · 3D</h1>
      <div class="row">
        <button id="open-btn">Open .tif file…</button>
      </div>
      <div class="row">
        <button id="recenter-btn">Recenter view</button>
      </div>
      <div class="row">
        <button id="fill-btn">Interpolate holes</button>
      </div>
      <div id="fill-panel" class="hidden">
        <div class="cap-row">
          <span>Max hole size</span>
          <span id="cap-label"></span>
        </div>
        <input type="range" id="cap-slider" min="0" max="1000" value="459" />
        <button id="apply-cap">Apply</button>
      </div>
      <div class="row">
        <label for="resolution">Resolution</label>
        <select id="resolution">
          <option value="256">256 · fast</option>
          <option value="512">512 · low</option>
          <option value="1024" selected>1024 · medium</option>
          <option value="2048">2048 · high</option>
          <option value="0">Native · heavy</option>
        </select>
      </div>
      <div class="row">
        <label for="colormap">Colormap</label>
        <select id="colormap"></select>
      </div>
      <div class="row">
        <div class="slider-head">
          <span>Vertical exaggeration</span>
          <input type="number" id="exag-input" min="0.01" step="0.1" value="10" />
        </div>
        <input type="range" id="exaggeration" min="0.1" max="30" step="0.1" value="10" />
      </div>
      <p class="hint">Drop a GeoTIFF anywhere.<br />Drag to orbit · scroll to zoom · right-drag to pan.</p>
    </div>

    <div id="info" class="hidden"></div>
    <div id="compass" class="hidden">
      <div id="compass-dial">
        <div class="needle south"></div>
        <div class="needle north"></div>
        <span class="cap">N</span>
      </div>
    </div>
    <div id="welcome">
      <div class="big">GeoTIFF 3D Visualizer</div>
      <div>Drag &amp; drop a .tif / .tiff to render its elevation surface</div>
    </div>
    <div id="dropzone" class="hidden">Drop GeoTIFF to load</div>
    <div id="loading" class="hidden">Loading raster…</div>
    <div id="error" class="hidden"></div>
    <input type="file" id="file-input" accept=".tif,.tiff" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
